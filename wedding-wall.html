  x.fillText(S.couple.date, W/2, top+(tall?200:170));
  // 主圖
  const A=tall?520:400, B=tall?1520:1110;
  await drawStoryArt(x, p, W/2, A, B, T, tpl, tall);
  // 頁尾
  x.textAlign='center'; x.textBaseline='alphabetic';
  x.fillStyle=tpl==='minimal'?T.ink:T.acc2; x.font=fontOf('--display',dw,tall?58:50);
  if(tpl==='retro'){ x.shadowColor=T.acc2; x.shadowBlur=18; }
  x.fillText(S.hashtag, W/2, tall?1665:1210); shadowOff(x);
  x.fillStyle=T.muted; x.font=fontOf('--body',400,30);
  x.fillText(`看整面祝福牆　${CFG.SHORT_URL}`, W/2, tall?1740:1272);
  return c;
}
async function drawStoryArt(x,p,cx,A,B,T,tpl,tall){
  const mid=(A+B)/2, avail=B-A, name=p.anon?'':p.name;
  const mode=p.ema?'ema':p.pc?'postcard':'polaroid';
  x.save();
  if(mode==='ema'){
    const bh=Math.min(avail-60,760), bw=bh*.74;
    const left=cx-bw/2, right=cx+bw/2, top=mid-bh/2+30, bottom=top+bh;
    x.strokeStyle=css('--ema-string'); x.fillStyle=css('--ema-string'); x.lineWidth=5;
    x.beginPath(); x.moveTo(cx-44,top-58); x.lineTo(cx,top+bh*.13); x.lineTo(cx+44,top-58); x.stroke();
    x.beginPath(); x.arc(cx,top-64,13,0,Math.PI*2); x.fill();
    shadowOn(x);
    x.beginPath(); x.moveTo(cx,top); x.lineTo(right,top+bh*.2); x.lineTo(right,bottom); x.lineTo(left,bottom); x.lineTo(left,top+bh*.2); x.closePath();
    const g=x.createLinearGradient(left,top,right,bottom); g.addColorStop(0,css('--ema-wood1')); g.addColorStop(1,css('--ema-wood2')); x.fillStyle=g; x.fill();
    shadowOff(x);
    x.save(); x.clip(); x.strokeStyle='rgba(90,55,25,.08)'; x.lineWidth=3; for(let gx=left;gx<right;gx+=14){ x.beginPath(); x.moveTo(gx,top); x.lineTo(gx+6,bottom); x.stroke(); } x.restore();
    x.fillStyle='rgba(0,0,0,.4)'; x.beginPath(); x.arc(cx,top+bh*.13,bw*.035,0,Math.PI*2); x.fill();
    const m=emaOf(p); drawMotifC(x,m,cx,top+bh*.27,bw*.24, m==='xi'?css('--ema-string'):css('--k-heart'));
    x.fillStyle=css('--ema-ink');
    const fs=Math.round(bw*.085); x.font=fontOf('--hand',400,fs); x.textAlign='center'; x.textBaseline='middle';
    const areaTop=top+bh*.40, areaBot=bottom-bh*.12, rowH=fs*1.14, rows=Math.max(1,Math.floor((areaBot-areaTop)/rowH));
    const colW=fs*1.45, maxCols=Math.max(1,Math.floor((bw*.84)/colW));
    let chars=Array.from((p.text||'新婚快樂').replace(/\s+/g,''));
    if(chars.length>rows*maxCols){ chars=chars.slice(0,rows*maxCols-1); chars.push('…'); }
    const cols=Math.ceil(chars.length/rows), startX=cx+(cols-1)*colW/2;
    chars.forEach((ch,i)=>{ const col=Math.floor(i/rows), row=i%rows; x.fillText(ch, startX-col*colW, areaTop+row*rowH+rowH/2); });
    if(name){ x.textAlign='left'; x.textBaseline='alphabetic'; x.font=fontOf('--body',400,Math.round(bw*.05)); x.globalAlpha=.85; x.fillText(name, left+bw*.09, bottom-bw*.06); x.globalAlpha=1; }
  } else if(mode==='postcard'){
    const fw=Math.min(800,(avail-60)*(tall?1.1:.95)), fh=fw*2/3;
    let im=null; try{ im=await loadImgURL(p.thumb||DESIGN_URL[pcOf(p)]); }catch(e){}
    x.save(); x.translate(cx+50, mid-fh*.42); x.rotate(tpl==='minimal'?0:.1);
    shadowOn(x); x.fillStyle=T.paper; x.fillRect(-fw/2-14,-fh/2-14,fw+28,fh+28); shadowOff(x);
    if(im) drawCover(x,im,-fw/2,-fh/2,fw,fh);
    x.restore();
    const bw2=fw*1.02, bh2=bw2*2/3;
    x.save(); x.translate(cx-30, mid+bh2*(tall?.38:.33)); x.rotate(tpl==='minimal'?0:-.06);
    shadowOn(x); x.fillStyle=T.paper; x.fillRect(-bw2/2,-bh2/2,bw2,bh2); shadowOff(x);
    if(tpl==='minimal'){ x.strokeStyle=T.ink; x.lineWidth=2; x.strokeRect(-bw2/2,-bh2/2,bw2,bh2); }
    const L=-bw2/2, Tp=-bh2/2, pad=bw2*.06;
    x.strokeStyle='rgba(0,0,0,.18)'; x.lineWidth=2; x.beginPath(); x.moveTo(L+bw2*.56,Tp+pad); x.lineTo(L+bw2*.56,Tp+bh2-pad); x.stroke();
    x.fillStyle=T.pink; x.font=fontOf('--hand',400,Math.round(bw2*.045)); x.textAlign='left'; x.textBaseline='top';
    wrapText(x,p.text||'新婚快樂！',bw2*.56-pad*1.6).slice(0,6).forEach((l,i)=>x.fillText(l,L+pad,Tp+pad+i*bw2*.064));
    const sw=bw2*.15, sh=sw*1.22, sx=L+bw2-pad-sw, sy=Tp+pad;
    x.strokeStyle=css('--stamp'); x.lineWidth=4; x.setLineDash([4,6]); x.strokeRect(sx,sy,sw,sh); x.setLineDash([]);
    drawMotifC(x,emaOf(p),sx+sw/2,sy+sh/2,sw*.55,css('--stamp'));
    x.save(); x.translate(sx-sw*.22, sy+sh*.66); x.rotate(-.25); x.strokeStyle=css('--pm'); x.fillStyle=css('--pm'); x.globalAlpha=.8; x.lineWidth=3;
    x.beginPath(); x.arc(0,0,sw*.6,0,Math.PI*2); x.stroke();
    x.textAlign='center'; x.textBaseline='middle'; x.font=fontOf('--body',700,Math.round(sw*.16)); x.fillText(S.couple.date,0,-sw*.1);
    x.font=fontOf('--body',400,Math.round(sw*.15)); x.fillText('喜訊郵局',0,sw*.17); x.restore();
    x.fillStyle=T.pink; x.textAlign='left'; x.textBaseline='alphabetic'; x.font=fontOf('--body',400,Math.round(bw2*.034));
    const lx=L+bw2*.6, lw=bw2*.34;
    [[`To ${S.couple.a} & ${S.couple.b}`, Tp+bh2*.68],[`From ${name||'一位賓客'}`, Tp+bh2*.86]].forEach(([t,y])=>{
      x.fillText(t,lx,y); x.strokeStyle='rgba(0,0,0,.2)'; x.lineWidth=2; x.beginPath(); x.moveTo(lx,y+12); x.lineTo(lx+lw,y+12); x.stroke(); });
    x.restore();
  } else {
    let im=null; if(p.thumb){ try{ im=await loadImgURL(p.thumb); }catch(e){} }
    const capH=tall?230:190, ph=Math.min(avail-capH-60,760), pw=ph*.8, fw=pw+56, fh=ph+28+capH;
    x.save(); x.translate(cx, mid); x.rotate(tpl==='minimal'?0:-.035);
    shadowOn(x); x.fillStyle=T.paper; x.fillRect(-fw/2,-fh/2,fw,fh); shadowOff(x);
    if(tpl==='minimal'){ x.strokeStyle=css('--line'); x.lineWidth=2; x.strokeRect(-fw/2,-fh/2,fw,fh); }
    const ix=-pw/2, iy=-fh/2+28;
    if(im){ if(tpl==='retro') x.filter='sepia(.25)'; drawCover(x,im,ix,iy,pw,ph); x.filter='none'; }
    else { x.fillStyle=T.bg; x.fillRect(ix,iy,pw,ph); drawKind(x,kindOf(p),0,iy+ph/2,pw*.45,0,{flower:css('--k-flower'),leaf:css('--k-leaf'),fruit:css('--k-fruit'),heart:css('--k-heart')}); }
    x.fillStyle=T.pink; x.textAlign='center'; x.textBaseline='top'; x.font=fontOf('--hand',400,42);
    const lines=wrapText(x,p.text||'',pw).slice(0,2); lines.forEach((l,i)=>x.fillText(l,0,iy+ph+28+i*56));
    if(name){ x.font=fontOf('--body',400,30); x.globalAlpha=.7; x.fillText('— '+name,0,iy+ph+38+lines.length*56); x.globalAlpha=1; }
    if(tpl==='forest'){ x.save(); x.translate(0,-fh/2); x.rotate(-.06); x.fillStyle='rgba(160,188,120,.75)'; x.fillRect(-90,-22,180,44); x.restore(); }
    if(tpl==='retro'){ x.fillStyle='#2b1e16'; x.beginPath(); x.moveTo(ix,iy); x.lineTo(ix+44,iy); x.lineTo(ix,iy+44); x.fill(); x.beginPath(); x.moveTo(ix+pw,iy+ph); x.lineTo(ix+pw-44,iy+ph); x.lineTo(ix+pw,iy+ph-44); x.fill(); }
    x.restore();
  }
  x.restore();
}

/* ========== 舞台互動：男女方拔河、歡呼分貝計、手機燈海 ========== */
const LIGHT_EFFECTS=[{id:'solid',name:'單色'},{id:'breathe',name:'呼吸'},{id:'flash',name:'跟拍閃爍'},{id:'wave',name:'波浪'},{id:'rainbow',name:'彩虹'}];
const LIGHT_COLORS=['#ff5c8a','#ff3b30','#ffb300','#ffffff','#4cc9f0','#8e7dff'];
const TEAM={L:{name:'男方親友'}, R:{name:'女方親友'}};
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
// 燈海的顏色只由「開始後經過的秒數」和「座位在場地中的左右位置」決定，
// 正式版每支手機用伺服器時間自己計算，就能全場同步。
function lightColor(st, t, px){
  if(st.effect==='rainbow') return `hsl(${Math.round((t*70+px*240)%360)} 95% 56%)`;
  const [r,g,b]=hexRgb(st.color); let k=1;
  if(st.effect==='breathe') k=.22+.78*(.5+.5*Math.sin(t*2*Math.PI/3));
  else if(st.effect==='flash'){ const ph=(t*st.bpm/60)%1; k=ph<.35?1:.05; }
  else if(st.effect==='wave') k=.1+.9*Math.pow(.5+.5*Math.sin(2*Math.PI*(t/2.2-px*1.3)),2);
  return `rgb(${Math.round(r*k)},${Math.round(g*k)},${Math.round(b*k)})`;
}
function guestPx(){ const t=parseInt(G.table,10); if(!t) return .5; return (((t-1)%5)+.5)/5; }
function confettiHTML(n=46){
  const colors=[css('--k-flower'),css('--k-fruit'),css('--k-leaf'),css('--k-heart'),css('--flash-hi')];
  let s=''; for(let i=0;i<n;i++) s+=`<i class="confetti" style="left:${Math.random()*100}%;background:${colors[i%colors.length]};animation-duration:${2.4+Math.random()*2.4}s;animation-delay:${Math.random()*1.2}s;border-radius:${i%3?2:9}px"></i>`;
  return s;
}

function startStage(type, opt){
  if(flashLive()){ toast('快閃任務進行中，請先結束快閃'); return; }
  if(S.stage) stopStage(true);
  const now=Date.now();
  if(type==='tug') S.stage={type, phase:'count', liveAt:now+3000, end:now+3000+opt.dur*1000, dur:opt.dur, L:0, R:0, penalty:opt.penalty, sim:opt.sim, rl:10, rr:10};
  if(type==='cheer'){ S.stage={type, phase:'live', level:0, heat:0, reward:opt.reward, src:'sim', hold:false}; startMic(S.stage); }
  if(type==='light') S.stage={type, phase:'live', effect:opt.effect, color:opt.color, bpm:opt.bpm, start:now};
  G.myTaps=0;
  buildStageWall(); renderGuest(); updateCtrl(); ensureStageLoop();
  toast({tug:'男女方拔河開始！',cheer:'歡呼分貝計開始',light:'手機燈海開始'}[type]);
}
function stopStage(silent){
  const st=S.stage; if(!st) return;
  if(st.stream){ try{ st.stream.getTracks().forEach(t=>t.stop()); }catch(e){} }
  if(st.ac){ try{ st.ac.close(); }catch(e){} }
  if(st.wake){ try{ st.wake.release(); }catch(e){} }
  S.stage=null; S.lastSwitch=Date.now();
  buildStageWall();
  if(!silent){ renderGuest(); updateCtrl(); drawFeatured(true); }
}
async function startMic(st){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    if(S.stage!==st){ stream.getTracks().forEach(t=>t.stop()); return; }
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const an=ac.createAnalyser(); an.fftSize=1024; ac.createMediaStreamSource(stream).connect(an);
    Object.assign(st,{src:'mic', stream, ac, analyser:an, buf:new Float32Array(an.fftSize)});
    toast('已使用這台電腦的麥克風量音量');
  }catch(e){
    st.src='sim';
    toast('這裡沒有麥克風權限，改用模擬模式：按住控制台的「模擬歡呼」');
  }
  buildStageWall(); updateCtrl();
}

function buildStageWall(){
  const el=$('#stage'), st=S.stage;
  if(!st){ el.hidden=true; el.innerHTML=''; return; }
  el.hidden=false; el.className='stage '+st.type;
  const A=esc(S.couple.a), B=esc(S.couple.b);
  if(st.type==='tug'){
    if(st.phase==='result'){
      const w=st.L>=st.R?'L':'R', lose=w==='L'?'R':'L';
      el.innerHTML=`${confettiHTML()}<div class="fl-head"><span class="fl-kicker">男女方拔河</span></div>
        <div class="st-result"><h2 style="color:var(--tug${w})">${TEAM[w].name}獲勝！</h2>
        <div class="st-sub">男方 ${Math.floor(st.L)} 下　vs　女方 ${Math.floor(st.R)} 下</div>
        <div class="st-reward">${TEAM[lose].name}：${esc(st.penalty)}</div></div>`;
    } else {
      el.innerHTML=`<div class="fl-head"><span class="fl-kicker">男女方拔河</span><span class="fl-count" id="tg-time">${st.dur}</span></div>
        <div class="tug-teams"><div class="team L"><b>${TEAM.L.name}</b><span>新郎 ${A} 這一邊</span><em id="tg-L">0</em></div>
          <div class="team R"><b>${TEAM.R.name}</b><span>新娘 ${B} 這一邊</span><em id="tg-R">0</em></div></div>
        ${st.phase==='count'?`<div class="cd-big" id="tg-cd">3</div>`:
        `<div class="rope-wrap" id="tg-wrap"><div class="win-line L"></div><div class="win-line R"></div><div class="center-line"></div><div class="rope" id="tg-rope"></div><div class="flag" id="tg-flag"></div></div>`}
        <div class="st-sub">${st.phase==='count'?'準備好手機，倒數結束就開始狂點！':'狂點手機螢幕，幫你那一邊用力拉！'}</div>`;
    }
  } else if(st.type==='cheer'){
    el.innerHTML=`${st.phase==='done'?confettiHTML():''}<div class="fl-head"><span class="fl-kicker">歡呼分貝計</span><span class="ch-src">${st.src==='mic'?'正在用麥克風量現場音量':'模擬模式'}</span></div>
      <div class="cheer-body">
        <div class="thermo"><div class="th-tube"><div class="th-heat" id="ch-heat"></div><div class="th-level" id="ch-level"></div></div><div class="th-bulb"></div></div>
        <div style="display:flex;flex-direction:column;gap:clamp(8px,1.4vw,18px)">
          <div class="ch-goal">${st.phase==='done'?'解鎖成功！':'全場一起喊，喊到滿格就解鎖'}</div>
          <div class="ch-reward">${esc(st.reward)}</div>
          <div class="ch-pct" id="ch-pct">0%</div>
        </div>
      </div>`;
  } else {
    const ef=LIGHT_EFFECTS.find(e=>e.id===st.effect);
    el.innerHTML=`<div class="fl-head"><span class="fl-kicker">手機燈海</span><span class="st-sub" style="text-align:right">效果：${ef?ef.name:''}</span></div>
      <canvas class="lt-canvas" id="lt-canvas" aria-label="全場手機燈海示意"></canvas>
      <div class="st-sub">請大家把手機舉高．投影上的每個光點代表一支賓客手機</div>`;
  }
}

let stRaf=null, stLast=0;
function ensureStageLoop(){ if(!stRaf){ stLast=0; stRaf=requestAnimationFrame(stageLoop); } }
function stageLoop(t){
  const st=S.stage;
  if(!st){ stRaf=null; return; }
  const dt=Math.min(.1, stLast ? (t-stLast)/1000 : 0); stLast=t;
  const now=Date.now();
  if(st.type==='tug') tugStep(st,now,dt);
  else if(st.type==='cheer') cheerStep(st,dt);
  else drawLight(st,now);
  guestStageSync();
  stRaf=requestAnimationFrame(stageLoop);
}
function tugStep(st,now,dt){
  if(st.phase==='count'){
    const cd=$('#tg-cd'); if(cd) cd.textContent=Math.max(1,Math.ceil((st.liveAt-now)/1000));
    if(now>=st.liveAt){ st.phase='live'; buildStageWall(); updateCtrl(); }
    return;
  }
  if(st.phase==='live'){
    if(st.sim){
      st.rl=Math.max(4,Math.min(16,st.rl+(Math.random()-.5)*dt*18));
      st.rr=Math.max(4,Math.min(16,st.rr+(Math.random()-.5)*dt*18));
      st.L+=st.rl*24*dt; st.R+=st.rr*24*dt;
    }
    if(now>=st.end){ st.phase='result'; buildStageWall(); updateCtrl(); return; }
  }
  if(st.phase!=='live') return;
  const left=Math.max(0,Math.ceil((st.end-now)/1000));
  const set=(id,v)=>{ const e=$('#'+id); if(e) e.textContent=v; };
  set('tg-time',left); set('tg-L',Math.floor(st.L)); set('tg-R',Math.floor(st.R));
  set('sc-tug-L',Math.floor(st.L)); set('sc-tug-R',Math.floor(st.R)); set('sc-tug-t',left);
  const wrap=$('#tg-wrap');
  if(wrap){
    const diff=(st.L-st.R)/(st.L+st.R+60);
    const off=-Math.max(-1,Math.min(1,diff*3))*wrap.clientWidth*.34;
    $('#tg-rope').style.transform=`translate(${off}px,-50%)`;
    $('#tg-flag').style.transform=`translate(${off}px,-50%)`;
  }
}
function cheerStep(st,dt){
  let lvl;
  if(st.src==='mic' && st.analyser){
    st.analyser.getFloatTimeDomainData(st.buf);
    let s=0; for(let i=0;i<st.buf.length;i++) s+=st.buf[i]*st.buf[i];
    const db=20*Math.log10(Math.sqrt(s/st.buf.length)+1e-6);
    lvl=Math.max(0,Math.min(100,(db+55)/50*100));
  } else lvl = st.hold ? 70+Math.random()*28 : 8+Math.random()*12;
  st.level += (lvl-st.level)*Math.min(1,dt*10);
  if(st.phase==='live'){
    if(st.level>45) st.heat += (st.level-45)/55*24*dt; else st.heat -= 5*dt;
    st.heat=Math.max(0,Math.min(100,st.heat));
    if(st.heat>=100){ st.phase='done'; buildStageWall(); updateCtrl(); toast('歡呼解鎖成功！'); }
  }
  const h=$('#ch-heat'); if(h) h.style.height=st.heat+'%';
  const l=$('#ch-level'); if(l) l.style.bottom=st.level+'%';
  const p=$('#ch-pct'); if(p) p.textContent=Math.round(st.heat)+'%';
  const c=$('#sc-ch-pct'); if(c) c.textContent=Math.round(st.heat)+'%';
}
function drawLight(st,now){
  const cv=$('#lt-canvas'); if(!cv || !cv.offsetParent) return;
  const W=cv.clientWidth, H=cv.clientHeight; if(!W||!H) return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  x.fillStyle='#04060a'; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.07)'; rr(x,W*.3,6,W*.4,H*.1,8); x.fill();
  x.fillStyle='rgba(255,255,255,.45)'; x.font=`500 ${Math.max(12,H*.035)}px ${css('--body')}`; x.textAlign='center'; x.textBaseline='middle'; x.fillText('舞台',W/2,6+H*.05);
  const t=(now-st.start)/1000, rows=3, cols=5, top=H*.22, rowH=(H-top)/rows, R=Math.min(W/cols,rowH)*.3;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const tx=W*(c+.5)/cols, ty=top+rowH*(r+.5);
    x.fillStyle='rgba(255,255,255,.05)'; x.beginPath(); x.arc(tx,ty,R*.8,0,Math.PI*2); x.fill();
    for(let k=0;k<10;k++){
      const a=k/10*Math.PI*2, sx=tx+Math.cos(a)*R*1.15, sy=ty+Math.sin(a)*R*1.15;
      const col=lightColor(st,t,sx/W);
      x.shadowColor=col; x.shadowBlur=R*.5; x.fillStyle=col;
      x.beginPath(); x.arc(sx,sy,Math.max(2.5,R*.17),0,Math.PI*2); x.fill();
    }
  }
  x.shadowBlur=0;
}

/* 賓客手機上的舞台畫面 */
function guestStageKey(){ const st=S.stage; return st ? `${st.type}:${st.phase}:${G.tugSide||''}:${st.effect||''}` : ''; }
function guestStageHTML(){
  const st=S.stage;
  if(st.type==='tug'){
    if(!G.tugSide) return `<div class="g-stage"><h2>男女方拔河！<br>你要幫哪一邊？</h2>
      <div class="side-pick"><button type="button" class="btn" data-side="L" style="background:var(--tugL);border-color:var(--tugL);color:#fff">男方親友<br><small>新郎 ${esc(S.couple.a)}</small></button>
      <button type="button" class="btn" data-side="R" style="background:var(--tugR);border-color:var(--tugR);color:#fff">女方親友<br><small>新娘 ${esc(S.couple.b)}</small></button></div></div>`;
    const me=TEAM[G.tugSide];
    if(st.phase==='count') return `<div class="g-stage"><h2>你是${me.name}</h2><div class="big" id="gt-cd" style="color:var(--tug${G.tugSide})">3</div><p class="hint">倒數結束就開始狂點按鈕</p></div>`;
    if(st.phase==='result'){
      const w=st.L>=st.R?'L':'R';
      return `<div class="g-stage"><h2>${w===G.tugSide?'你們這邊贏了！':'這次輸了一點點'}</h2>
        <div class="vs"><span>男方 <b>${Math.floor(st.L)}</b></span><span>女方 <b>${Math.floor(st.R)}</b></span></div>
        <p class="hint">你一共點了 ${G.myTaps||0} 下${w!==G.tugSide?`，準備派代表上台：${esc(st.penalty)}`:''}</p></div>`;
    }
    return `<div class="g-stage"><h2 style="color:var(--tug${G.tugSide})">幫${me.name}用力拉！</h2>
      <button type="button" class="tap-btn" id="gt-tap" style="background:var(--tug${G.tugSide})">拉！</button>
      <p>我點了 <b id="gt-mine">${G.myTaps||0}</b> 下．剩 <b id="gt-time">${st.dur}</b> 秒</p>
      <div class="vs"><span>男方 <b id="gt-L">0</b></span><span>女方 <b id="gt-R">0</b></span></div></div>`;
  }
  if(st.type==='cheer'){
    return `<div class="g-stage"><h2>${st.phase==='done'?'解鎖成功！':'大聲歡呼！'}</h2>
      <p class="hint">${st.phase==='done'?'看舞台！':'不用按手機，全場一起喊，喊到投影的溫度計滿格'}</p>
      <div class="ch-reward" style="font-size:24px">${esc(st.reward)}</div>
      <div class="mini-meter"><i id="gc-bar"></i></div></div>`;
  }
  const ef=LIGHT_EFFECTS.find(e=>e.id===st.effect);
  return `<div class="g-light" id="g-light"><div class="gl-big">把手機舉高</div><div>全場手機正在同步變色．${ef?ef.name:''}</div>
    <button type="button" class="btn small ghost" id="g-light-fs" style="color:#fff;border-color:#fff">全螢幕</button></div>`;
}
function bindGuestStage(){
  document.querySelectorAll('[data-side]').forEach(b=>b.addEventListener('click',()=>{ G.tugSide=b.dataset.side; renderGuest(); }));
  const tap=$('#gt-tap');
  if(tap) tap.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const st=S.stage; if(!st||st.type!=='tug'||st.phase!=='live') return;
    st[G.tugSide]+=1; G.myTaps=(G.myTaps||0)+1;
    const m=$('#gt-mine'); if(m) m.textContent=G.myTaps;
    try{ navigator.vibrate && navigator.vibrate(8); }catch(_){}
  });
  const fs=$('#g-light-fs');
  if(fs) fs.addEventListener('click',()=>{ const ph=document.querySelector('.phone'); try{ const r=ph.requestFullscreen&&ph.requestFullscreen(); if(r&&r.catch) r.catch(()=>toast('這個環境不支援全螢幕')); }catch(_){ toast('這個環境不支援全螢幕'); } });
  if(S.stage && S.stage.type==='light' && navigator.wakeLock){ navigator.wakeLock.request('screen').then(w=>{ if(S.stage) S.stage.wake=w; else w.release(); }).catch(()=>{}); }
}
function guestStageSync(){
  if(G.stageKey!==guestStageKey()){ renderGuest(); return; }
  const st=S.stage; if(!st) return;
  if(st.type==='tug'){
    const now=Date.now(), set=(id,v)=>{ const e=$('#'+id); if(e) e.textContent=v; };
    if(st.phase==='count') set('gt-cd',Math.max(1,Math.ceil((st.liveAt-now)/1000)));
    if(st.phase==='live'){ set('gt-L',Math.floor(st.L)); set('gt-R',Math.floor(st.R)); set('gt-time',Math.max(0,Math.ceil((st.end-now)/1000))); }
  } else if(st.type==='cheer'){
    const b=$('#gc-bar'); if(b) b.style.width=st.heat+'%';
  } else {
    const el=$('#g-light'); if(el) el.style.background=lightColor(st,(Date.now()-st.start)/1000,guestPx());
  }
}

  $('#sc-tug-setup').hidden=typ==='tug'; $('#sc-tug-live').hidden=typ!=='tug';
  $('#sc-ch-setup').hidden=typ==='cheer'; $('#sc-ch-live').hidden=typ!=='cheer';
  $('#sc-tug-go').disabled=!!ph; $('#sc-ch-go').disabled=!!ph; $('#sc-lt-go').disabled=!!ph;
  $('#sc-lt-go').textContent = typ==='light' ? '停止燈海，回到祝福牆' : '開始燈海';
  $('#sc-lt-go').className = typ==='light' ? 'btn warnb' : 'btn';
  $('#sc-lt-bpm-w').hidden = $('#sc-lt-fx .on').dataset.fx!=='flash';
  if(typ==='tug'){ $('#sc-tug-phase').textContent = st.phase==='count'?'倒數中':st.phase==='result'?'已結束':'秒';
    if(st.phase==='result'){ $('#sc-tug-t').textContent=st.L>=st.R?'男方勝':'女方勝'; $('#sc-tug-L').textContent=Math.floor(st.L); $('#sc-tug-R').textContent=Math.floor(st.R); } }
  if(typ==='cheer'){ $('#sc-ch-src').textContent = st.phase==='done' ? '已解鎖！投影正在慶祝' : st.src==='mic' ? '正在用麥克風量測' : '模擬模式：按住下方按鈕代表全場在歡呼'; $('#sc-ch-hold').hidden = st.src==='mic' || st.phase==='done'; }
  $('#cf-start').disabled=!!S.stage;
  // 集氣
  $('#ce-on').checked=S.energy.on;
  S.energy.ms.forEach((m,i)=>{ const c=$('#ce-s'+i); c.textContent=m.unlocked?'已解鎖':'未達成'; c.className='chip '+(m.unlocked?'c-ok':'c-muted'); $('#ce-r'+i).disabled=!m.unlocked; });
  // 投影
  $('#c-screen-wall').textContent = GAME_INFO[S.game].name;
  [...$('#c-screen').children].forEach(b=>b.classList.toggle('on', b.dataset.screen===S.screen));
  $('#c-wallctl').hidden = S.screen!=='wall';
  $('#c-mosaicctl').hidden = S.screen!=='mosaic';
  $('#c-thanksctl').hidden = S.screen!=='thanks';
  $('#c-pause').textContent = S.paused?'繼續輪播':'暫停輪播';
  $('#c-reveal').textContent = S.revealed?'收起合照':'揭曉新人合照';
  $('#c-rv-live').checked = !S.review; $('#c-rv-review').checked = S.review;
  [...$('#c-filter').children].forEach(b=>b.classList.toggle('on', b.dataset.f===S.filter));
  $('#c-approve-all').hidden = !pend;
  $('#c-auto').checked = S.auto;
  $('#c-cp').src = S.couplePhoto;

  const list = all.filter(p=>S.filter==='all'||p.status===S.filter).sort((a,b)=>b.ts-a.ts);
  const stChip = {shown:'<span class="chip c-ok">顯示中</span>', pending:'<span class="chip c-warn">待審核</span>', hidden:'<span class="chip c-danger">已隱藏</span>'};
  $('#c-list').innerHTML = list.length ? list.map(p=>{
    let acts='';
    if(p.status==='pending') acts=`<button type="button" class="btn small" data-act="approve" data-id="${p.id}">核准</button><button type="button" class="btn warnb small" data-act="hide" data-id="${p.id}">隱藏</button>`;
    else if(p.status==='shown') acts=`<button type="button" class="btn warnb small" data-act="hide" data-id="${p.id}">隱藏</button><button type="button" class="btn ghost small" data-act="pin" data-id="${p.id}">${p.pinned?'取消置頂':'置頂'}</button><button type="button" class="btn ghost small" data-act="play" data-id="${p.id}">立即投影</button>`;
    else acts=`<button type="button" class="btn ghost small" data-act="show" data-id="${p.id}">恢復顯示</button>`;
    const thumb = p.thumb
      ? `<button type="button" class="pr-thumb" data-act="view" data-id="${p.id}" aria-label="查看 ${esc(p.name)} 的原圖" style="background-image:url('${p.thumb}')"></button>`
      : `<div class="pr-thumb text" title="文字祝福">${kindSVG(kindOf(p),34)}</div>`;
    return `<div class="post-row st-${p.status}">${thumb}
      <div><div class="pr-meta"><b>${esc(p.name)}</b>${p.table?`<span>第 ${esc(p.table)} 桌</span>`:''}<span>${hhmm(p.ts)}</span>${stChip[p.status]}${p.anon?'<span class="chip c-muted">匿名顯示</span>':''}${p.privatePhoto?'<span class="chip c-muted">照片只給新人</span>':''}${p.publicOk?'<span class="chip c-ok">同意公開</span>':''}${p.flashId?'<span class="chip c-acc">快閃</span>':''}${p.pinned?'<span class="chip c-acc">置頂</span>':''}${p.id===S.featId&&S.screen==='wall'?'<span class="chip c-acc">投影中</span>':''}${p.sample?'<span class="chip c-muted">範例</span>':''}</div>
        <div class="pr-text">${esc(p.text||'（只有照片）')}</div><div class="pr-task">${esc(chipText(p))}</div></div>
      <div class="pr-acts">${acts}</div></div>`;
  }).join('') : `<p class="hint">這個分類目前沒有投稿。</p>`;

  $('#cp-stats').innerHTML = `
    <div><b>${all.filter(p=>p.anon).length}</b><span>則匿名顯示</span></div>
    <div><b>${all.filter(p=>p.privatePhoto).length}</b><span>張照片只給新人</span></div>
    <div><b>${all.filter(p=>p.publicOk&&p.status==='shown').length}</b><span>則可放公開精選頁</span></div>`;
  const inc = all.filter(p=>p.status==='shown'||(S.includeHidden&&p.status==='hidden'));
  const photos = inc.filter(p=>p.thumb);
  const total = photos.reduce((s,p)=>s+(p.fullSize||0),0);
  $('#c-export').innerHTML = `<div class="ex-grid">
    <div><b>${inc.length}</b><span>則祝福（${photos.length} 張照片）</span></div>
    <div><b>${Math.ceil(inc.length/2)+2}</b><span>頁（每頁 2 則，含封面與結尾）</span></div>
    <div><b>${fmtSize(total)}</b><span>原圖總大小</span></div></div>`;
}
function openLightbox(p){
  if(!p.thumb) return;
  const lb=$('#lightbox');
  lb.innerHTML = `<div class="lb-card" role="dialog" aria-label="照片資訊">
    <img src="${p.full||p.thumb}" alt="">
    <dl class="lb-info">
      <dt>上傳者</dt><dd>${esc(p.name)}${p.table?`．第 ${esc(p.table)} 桌`:''}</dd>
      <dt>印刷用原圖</dt><dd>${p.fullW}×${p.fullH}．${fmtSize(p.fullSize)}（300dpi 約 ${printCm(p.fullW,p.fullH)}）</dd>
      <dt>投影用縮圖</dt><dd>${fmtSize(p.thumbSize)}</dd>
      ${p.origSize?`<dt>手機原檔</dt><dd>${fmtSize(p.origSize)}</dd>`:''}
      ${p.sample?'<dt>備註</dt><dd>範例投稿，原圖大小為模擬數值</dd>':''}
    </dl>
    <button type="button" class="btn block" id="lb-close">關閉</button></div>`;
  lb.hidden=false;
  $('#lb-close').onclick=()=>{ lb.hidden=true; };
}
$('#lightbox').addEventListener('click',e=>{ if(e.target.id==='lightbox') e.target.hidden=true; });

/* ========== 共用 ========== */
function refresh(){
  updateWall(); updateCtrl();
  const f=S.posts.find(p=>p.id===S.featId);
  if(!f || f.status!=='shown') advance(); else drawFeatured();
  if(S.game==='tree') drawTree();
  if(S.screen==='mosaic') drawMosaic();
  if(S.screen==='thanks') renderThanks();
  if(S.flash) updateFlashUI();
  checkEnergy();
}
function setView(v){
  S.view=v;
  ['guest','wall','ctrl'].forEach(k=>{ $('#v-'+k).hidden = k!==v; });
  [...$('#view-seg').children].forEach(b=>b.classList.toggle('on', b.dataset.view===v));
  if(v==='guest') renderGuest();
  if(v==='wall'){ updateWall(); drawFeatured(true); if(S.screen==='mosaic') drawMosaic(); if(S.screen==='thanks') renderThanks(); }
  if(v==='ctrl') updateCtrl();
  window.scrollTo(0,0);
}
function setGame(g){
  S.game=g;
  $('#featured').dataset.id=''; $('#side-feat').dataset.id=''; S.rackKey=''; S.boardKey='';
  if(G.checked && G.mode!=='flash' && G.step!=='upload'){ resetCompose(); G.step=firstStep(); }
  renderGuest(); refresh(); drawFeatured(true);
  toast(`已切換到「${GAME_INFO[g].name}」`);
}
$('#view-seg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setView(b.dataset.view); });
$('#game-select').addEventListener('change',e=>setGame(e.target.value));
$('#tpl-select').addEventListener('change',e=>{
  S.tpl=e.target.value; document.documentElement.dataset.tpl=S.tpl;
  drawQR(); drawTree(); if(S.screen==='mosaic') drawMosaic();
  if(G.step==='done' && G.last){ G.storyURL=null; G.storyBlob=null; renderGuest(); genStory(); }
});
$('#w-full').onclick=()=>{ const w=$('#wall'); try{ const r=w.requestFullscreen&&w.requestFullscreen(); if(r&&r.catch) r.catch(()=>toast('這個環境不支援全螢幕')); else if(!r) toast('這個環境不支援全螢幕'); }catch(_){ toast('這個環境不支援全螢幕'); } };
document.addEventListener('keydown',e=>{
  if(S.view!=='wall' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight'){ advance(); }
  if(e.key===' '){ e.preventDefault(); S.paused=!S.paused; S.lastSwitch=Date.now(); refresh(); }
});
let rzT; window.addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if(S.view==='wall'){ if(S.screen==='mosaic') drawMosaic(); drawTree(); S.rackKey=''; updateWall(); drawFeatured(); } },150); });

setInterval(()=>{
  const now=Date.now();
  const holding = !!S.flash || S.unlockShowing || !!S.stage;
  if(!S.paused && !holding && S.screen==='wall' && now-S.lastSwitch >= S.interval*1000) advance();
  const pr=$('#w-progress'); if(pr) pr.style.width = (S.paused||holding||S.screen!=='wall') ? '0' : Math.min(100,(now-S.lastSwitch)/(S.interval*10))+'%';
  if(S.auto && !flashLive() && now-S.lastAuto>9000){ S.lastAuto=now; simulate(); }
  if(S.flash){
    if(S.flash.phase==='live'){
      tickFlash();
      if(S.flashSim && now>=S.nextFlashSim){ S.nextFlashSim=now+1400+Math.random()*2600; simulate(); }
      if(now>=S.flash.end) endFlash();
    } else if(now>=S.flash.resultUntil){ closeFlash(); }
  }
  if(!S.flash && !S.stage && !S.unlockShowing && S.unlockQ.length) runUnlockQueue();
  if(G.bannerOn!==bannerWanted()) renderGuest();
}, 250);

/* ========== 啟動 ========== */
document.documentElement.dataset.tpl = S.tpl;
S.couplePhoto = genCouple();
PC_DESIGNS.forEach(d=>{ DESIGN_URL[d.id]=genDesign(d.id); });
const t0 = Date.now();
SAMPLES.forEach((s,i)=>{
  const ph = s.noPhoto ? {thumb:null} : (()=>{ const t=genSample(i+3); return {thumb:t, full:null, fullW:2400, fullH:3000, fullSize:1.25e6+((i*337)%600)*1000, thumbSize:t.length*.75}; })();
  const d=Object.assign({}, s); delete d.noPhoto;
  if(d.cardId==null) d.cardId=s.noPhoto?null:d.cardId;
  S.posts.push(Object.assign({id:'p'+(++uid), ts:t0-(SAMPLES.length-i)*95000, pinned:false, status:'shown', sample:true}, d, ph));
});
S.energy.ms.forEach(m=>{ m.unlocked = visible().length>=m.n; });
buildCtrl(); drawQR(); renderGuest(); advance(); refresh();
</script>
