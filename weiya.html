<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>尾牙主持人展示板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&family=JetBrains+Mono:wght@500;700&family=Saira+Stencil+One&display=swap">
<style>
/* 版面：頁首切換產業套組；左側遊戲庫（依類型分組）、中間投影預覽、右側控制與主持手卡。
   每個套組是一個單一深色世界：經典＝漆紅金箔、物流＝柏油路面＋安全橘、科技＝深夜機房＋訊號藍 */
:root{
  --ink:#170907; --panel:#221110; --panel-2:#2d1613; --line:#4b231c;
  --primary:#8e1d18; --hot:#cf3a2f; --hi:#e4b75e; --hi-soft:#f2d69b; --ok:#62c29a;
  --paper:#f6ead6; --muted:#b4978a; --on-hi:#2b1712;
  --card:#f3e6cc; --card-ink:#2b1712; --card-rule:#d9c39b; --card-accent:#8e1d18;
  --stage-a:#5c1411; --stage-b:#2a0a08; --stage-c:#120504; --frame:rgba(228,183,94,.55);
  --stage-pattern:none;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"Noto Serif TC","Songti TC",serif;
  --display-w:900; --track:normal;
  color-scheme:dark;
}
:root[data-industry="logistics"]{
  --ink:#121416; --panel:#1c1f22; --panel-2:#262a2e; --line:#383d43;
  --primary:#e2601b; --hot:#ff7b2e; --hi:#f4c21b; --hi-soft:#ffe07a; --ok:#59c98a;
  --paper:#eef0f2; --muted:#9aa2ab; --on-hi:#16181a;
  --card:#fff6d6; --card-ink:#16181a; --card-rule:#e8d9a0; --card-accent:#e2601b;
  --stage-a:#2a2e33; --stage-b:#17191c; --stage-c:#0c0d0f; --frame:rgba(244,194,27,.7);
  --stage-pattern:repeating-linear-gradient(135deg,rgba(244,194,27,.9) 0 1.6cqw,rgba(18,20,22,.9) 1.6cqw 3.2cqw);
  --display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"Saira Stencil One","Noto Sans TC",sans-serif;
  --display-w:900; --track:.02em;
}
:root[data-industry="tech"]{
  --ink:#0a0f1c; --panel:#111a2c; --panel-2:#17233b; --line:#24324f;
  --primary:#2f6bff; --hot:#ff4f7b; --hi:#5ad1ff; --hi-soft:#b9ecff; --ok:#6ef0aa;
  --paper:#e6edf7; --muted:#8b9ab5; --on-hi:#0a0f1c;
  --card:#e9eef7; --card-ink:#0d1526; --card-rule:#cdd7ea; --card-accent:#2f6bff;
  --stage-a:#13254d; --stage-b:#0b1428; --stage-c:#050912; --frame:rgba(90,209,255,.5);
  --stage-pattern:linear-gradient(rgba(90,209,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(90,209,255,.07) 1px,transparent 1px);
  --display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"JetBrains Mono",ui-monospace,monospace;
  --display-w:700; --track:.01em;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.6;transition:background .3s}
.wrap{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:18px 40px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}

.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 24px;align-items:end;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px}
@media(max-width:900px){.top{grid-template-columns:minmax(0,1fr)}}
.brand small{display:block;color:var(--hi);letter-spacing:.25em;font-size:12px}
.brand h1{margin:0;font-family:var(--display);font-weight:var(--display-w);letter-spacing:var(--track);font-size:clamp(24px,3vw,34px);line-height:1.25;text-wrap:balance}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 12px;min-width:96px}
.stat b{display:block;font-family:var(--num);font-size:20px;color:var(--hi-soft);font-variant-numeric:tabular-nums;line-height:1.25;font-weight:700}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.08em}
.kit{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end}
.kit-switch{display:flex;flex-wrap:wrap;gap:6px}
.kit-btn{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 14px;cursor:pointer;text-align:left;display:grid;line-height:1.35}
.kit-btn small{color:var(--muted);font-size:12px}
.kit-btn[aria-pressed="true"]{background:var(--primary);border-color:var(--hi);color:#fff}
.kit-btn[aria-pressed="true"] small{color:var(--hi-soft)}
.kit .field{min-width:180px}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 330px;gap:18px;align-items:start}
@media(max-width:1160px){.layout{grid-template-columns:minmax(0,1fr) 310px}.library{grid-column:1/-1}.library .groups{display:flex;flex-wrap:wrap;gap:10px 16px}.library .grp ol{display:flex;flex-wrap:wrap;gap:6px}.library .grp li{flex:0 0 auto}}
@media(max-width:780px){.layout{grid-template-columns:minmax(0,1fr)}}
.sec-label{font-size:12px;letter-spacing:.2em;color:var(--muted);margin:0 0 8px}

/* 遊戲庫 */
.groups{display:grid;gap:14px}
.grp h2{margin:0 0 6px;font-size:12px;letter-spacing:.2em;color:var(--hi);font-weight:500;display:flex;gap:6px;align-items:baseline}
.grp h2 span{color:var(--muted);letter-spacing:0}
.grp ol{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.grp button{width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:4px;padding:7px 10px;cursor:pointer;display:grid;line-height:1.4}
.grp button:hover{background:var(--panel)}
.grp .nm{font-weight:700}
.grp .ds{font-size:12px;color:var(--muted)}
.grp button[aria-current="true"]{background:var(--primary);border-color:var(--hot);color:#fff}
.grp button[aria-current="true"] .ds{color:var(--hi-soft)}

/* 投影 */
.preview-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.preview-head .sec-label{margin:0}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;border-radius:4px;
  background:radial-gradient(ellipse at 50% 115%,var(--stage-a) 0%,var(--stage-b) 55%,var(--stage-c) 100%);
  box-shadow:inset 0 0 0 .7cqw var(--stage-c),inset 0 0 0 .85cqw var(--frame);font-size:1.6cqw;color:var(--paper)}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0}
[data-industry="tech"] .stage::before{background-image:var(--stage-pattern);background-size:4cqw 4cqw}
[data-industry="logistics"] .stage::before{top:auto;height:1.4cqw;background-image:var(--stage-pattern)}
.stage:fullscreen{aspect-ratio:auto;border-radius:0;width:100vw;height:100vh}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.s-top{position:absolute;top:2.4cqw;left:3.2cqw;right:3.2cqw;display:flex;justify-content:space-between;gap:2cqw;font-size:1.25cqw;letter-spacing:.25em;color:var(--hi-soft);z-index:4}
.s-body{position:absolute;inset:6.5cqw 4.5cqw 4cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;text-align:center;z-index:2}
.s-eyebrow{font-size:1.9cqw;color:var(--hi);letter-spacing:.3em}
.s-big{font-family:var(--num);font-weight:900;font-size:10cqw;line-height:1;font-variant-numeric:tabular-nums}
.s-big small{font-family:var(--body);font-size:2.6cqw;color:var(--muted);margin-left:.6cqw;font-weight:500}
.s-title{font-family:var(--display);font-weight:var(--display-w);letter-spacing:var(--track);font-size:6cqw;line-height:1.15}
.s-sub{font-size:1.7cqw;color:var(--muted)}
.banner{font-family:var(--display);font-weight:var(--display-w);font-size:3.6cqw;color:var(--hi-soft);min-height:1.3em}

/* 報到 */
.s-ci{display:grid;grid-template-columns:1fr 1.3fr;gap:4cqw;align-items:center;width:100%;text-align:left}
.ci-bars{display:grid;gap:1.3cqw}
.ci-row{display:grid;grid-template-columns:10cqw 1fr 7cqw;gap:1.2cqw;align-items:center;font-size:1.5cqw}
.ci-track{height:1.6cqw;background:rgba(255,255,255,.08);border-radius:1cqw;overflow:hidden}
[data-industry="logistics"] .ci-track{border-radius:0}
.ci-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--hi));transition:width .6s ease}
.ci-row b{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--hi-soft);text-align:right}
.ci-row.lead span:first-child{color:var(--hi)}
.ticker{margin-top:2cqw;font-size:1.5cqw;color:var(--hi-soft);border-top:1px solid var(--line);padding-top:1.2cqw}

/* 抽獎 */
.roll{font-family:var(--display);font-weight:var(--display-w);font-size:8.5cqw;line-height:1.15;min-height:1.15em}
.roll.won{color:var(--hi-soft);text-shadow:0 0 3cqw var(--frame);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.prize-line{font-family:var(--display);font-weight:var(--display-w);font-size:3cqw}
.meta-line{font-family:var(--num);font-size:1.8cqw;color:var(--muted);min-height:1.4em}
[data-industry="logistics"] .roll.won{background:var(--paper);color:var(--on-hi);padding:.4cqw 3cqw;border:.5cqw solid var(--on-hi);text-shadow:none}
.won-strip{display:flex;flex-wrap:wrap;justify-content:center;gap:.8cqw;font-size:1.4cqw;max-width:80%}
.won-strip span{border:1px solid var(--frame);padding:.2cqw 1cqw;border-radius:.4cqw;color:var(--hi-soft)}

/* 拔河 */
.tug{width:100%;display:grid;gap:2.5cqw}
.tug-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:2cqw}
.tug-team{font-family:var(--display);font-weight:var(--display-w);font-size:4.2cqw;line-height:1.15;text-align:left}
.tug-team small{display:block;font-family:var(--body);font-weight:500;font-size:1.5cqw;color:var(--muted)}
.tug-team.b{text-align:right}
.clock{font-family:var(--num);font-weight:900;font-size:6cqw;color:var(--hi);font-variant-numeric:tabular-nums;line-height:1}
.rope{position:relative;height:5cqw}
.rope::before{content:"";position:absolute;left:0;right:0;top:50%;height:1.1cqw;transform:translateY(-50%);border-radius:1cqw;background:repeating-linear-gradient(115deg,#c9a46a 0 1.2cqw,#9c7a45 1.2cqw 2.2cqw)}
[data-industry="logistics"] .rope::before{border-radius:0;height:1.4cqw;background:repeating-linear-gradient(90deg,#f4c21b 0 2cqw,#16181a 2cqw 3cqw)}
[data-industry="tech"] .rope::before{height:.6cqw;background:linear-gradient(90deg,var(--hot),var(--hi));box-shadow:0 0 1.5cqw var(--hi)}
.rope .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--paper);opacity:.5}
.knot{position:absolute;top:50%;width:4.2cqw;height:4.2cqw;border-radius:50%;background:var(--hot);border:.4cqw solid var(--hi);transform:translate(-50%,-50%);transition:left .12s linear}
[data-industry="logistics"] .knot{border-radius:.3cqw;background:#b07a45;border-color:#e8d2a6}
[data-industry="tech"] .knot{border-radius:.4cqw;background:var(--ink);border-color:var(--hi);box-shadow:0 0 2cqw var(--hi)}
.tug-score{display:flex;justify-content:space-between;font-family:var(--num);font-size:1.7cqw;color:var(--hi-soft);font-variant-numeric:tabular-nums}

/* 紅包雨 */
.rain-board{position:absolute;right:3.5cqw;top:6.5cqw;width:24cqw;background:rgba(0,0,0,.6);border:1px solid var(--frame);border-radius:.6cqw;padding:1.2cqw 1.4cqw;z-index:3;text-align:left}
.rain-board h4{margin:0 0 .6cqw;font-size:1.4cqw;letter-spacing:.2em;color:var(--hi)}
.rain-board ol{margin:0;padding-left:2.2cqw;font-size:1.45cqw;display:grid;gap:.3cqw}
.rain-board li b{float:right;color:var(--hi-soft);font-family:var(--num);font-variant-numeric:tabular-nums}
.corner-clock{position:absolute;left:3.5cqw;top:6.5cqw;z-index:3;font-family:var(--num);font-weight:900;font-size:5cqw;color:var(--hi);font-variant-numeric:tabular-nums}
.rain-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;pointer-events:none;text-align:center;gap:1cqw}

/* 分貝 */
.meter{display:flex;gap:.45cqw;align-items:end;height:16cqw;width:70%}
.meter i{flex:1;background:rgba(255,255,255,.07);border-radius:.3cqw;transition:background .08s}
.meter i.on{background:var(--hi)}
.meter i.on.hot{background:var(--hot)}
.db-num{font-family:var(--num);font-weight:900;font-size:9cqw;line-height:1;font-variant-numeric:tabular-nums}
.db-num small{font-family:var(--body);font-size:2.6cqw;color:var(--muted)}

/* 燈海 */
.light-msg{position:absolute;left:0;right:0;bottom:7cqw;z-index:3;text-align:center;font-family:var(--display);font-weight:var(--display-w);font-size:4.4cqw;color:var(--paper);text-shadow:0 0 2cqw rgba(0,0,0,.85);padding-inline:6cqw}
.light-count{position:absolute;left:3.5cqw;top:6.5cqw;z-index:3;font-size:1.6cqw;color:var(--hi-soft);font-family:var(--num)}

/* 彈幕 */
.dm-layer{position:absolute;inset:6cqw 0 4cqw;z-index:2;overflow:hidden}
.dm{position:absolute;left:100%;white-space:nowrap;font-size:2.6cqw;font-weight:700;color:var(--paper);text-shadow:0 0 .8cqw rgba(0,0,0,.9);animation:fly 9s linear forwards}
.dm b{color:var(--hi);font-weight:500;font-size:.7em;margin-right:.6em}
@keyframes fly{to{transform:translateX(calc(-100cqw - 100%))}}
.dm-pin{position:absolute;top:7cqw;left:50%;transform:translateX(-50%);z-index:3;background:var(--hi);color:var(--on-hi);font-weight:900;font-size:2.4cqw;padding:.5cqw 2cqw;border-radius:.4cqw;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.dm-foot{position:absolute;left:3.5cqw;bottom:2.4cqw;z-index:3;font-size:1.4cqw;color:var(--muted)}
.queue{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:210px;overflow:auto}
.queue li{background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 9px;display:grid;gap:6px;font-size:13px}
.queue li.flag{border-color:var(--hot)}
.queue li small{color:var(--muted)}
.queue .row .btn{padding:4px 10px;font-size:12px}

/* 搶答 */
.quiz{width:100%;display:grid;gap:1.6cqw}
.quiz-q{font-family:var(--display);font-weight:var(--display-w);font-size:3.6cqw;line-height:1.3;text-wrap:balance}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw;text-align:left}
.opt{position:relative;border:1px solid var(--frame);border-radius:.6cqw;padding:1.2cqw 1.6cqw;overflow:hidden;font-size:2.1cqw;display:flex;justify-content:space-between;gap:1cqw}
.opt i{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.08);transition:width .4s ease;z-index:0}
.opt span,.opt b{position:relative;z-index:1}
.opt b{font-family:var(--num);color:var(--hi-soft)}
.opt.right{border-color:var(--ok);box-shadow:0 0 0 .25cqw var(--ok)}
.opt.right i{background:color-mix(in srgb,var(--ok) 35%,transparent)}
.opt.dim{opacity:.45}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;font-size:1.6cqw;color:var(--muted)}

/* 終極密碼 */
.range{font-family:var(--num);font-weight:900;font-size:12cqw;line-height:1;font-variant-numeric:tabular-nums;display:flex;gap:3cqw;align-items:center}
.range em{font-style:normal;font-size:4cqw;color:var(--hi)}
.range-bar{position:relative;width:70%;height:1.4cqw;background:rgba(255,255,255,.08);border-radius:1cqw}
.range-bar i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--primary),var(--hi));border-radius:1cqw;transition:left .4s,width .4s}
.boom{font-family:var(--display);font-weight:var(--display-w);font-size:8cqw;color:var(--hot);animation:pop .5s ease}

/* 人氣投票 */
.vote{width:100%;display:grid;gap:1.1cqw;text-align:left}
.vrow{display:grid;grid-template-columns:24cqw 1fr 9cqw;gap:1.2cqw;align-items:center;font-size:1.7cqw;transition:transform .4s}
.vrow small{display:block;color:var(--muted);font-size:1.3cqw}
.vbar{height:3cqw;background:rgba(255,255,255,.06);border-radius:.4cqw;overflow:hidden}
.vbar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--hi));transition:width .4s ease}
.vrow.first .vbar i{background:linear-gradient(90deg,var(--hi),var(--hi-soft))}
.vrow b{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--hi-soft);text-align:right;font-size:2.2cqw}

/* 賓果 */
.bingo{display:grid;grid-template-columns:auto 1fr;gap:3.5cqw;align-items:center;width:100%}
.ball{width:20cqw;height:20cqw;border-radius:50%;display:grid;place-items:center;align-content:center;background:radial-gradient(circle at 35% 30%,var(--hi-soft),var(--hi) 45%,var(--primary));color:var(--on-hi);box-shadow:0 1cqw 3cqw rgba(0,0,0,.5)}
[data-industry="logistics"] .ball{border-radius:1cqw;background:var(--paper);border:.6cqw solid var(--on-hi)}
[data-industry="tech"] .ball{border-radius:1.2cqw;background:var(--ink);color:var(--hi);border:.3cqw solid var(--hi);box-shadow:0 0 3cqw var(--frame)}
.ball small{font-size:3cqw;font-weight:900;line-height:1}
.ball b{font-family:var(--num);font-size:9cqw;line-height:1}
.ball.fresh{animation:pop .45s ease}
.bboard{display:grid;grid-template-columns:3cqw repeat(15,1fr);gap:.35cqw;font-family:var(--num);font-size:1.25cqw}
.bboard span{display:grid;place-items:center;height:2.6cqw;border-radius:.3cqw;background:rgba(255,255,255,.05);color:var(--muted);font-variant-numeric:tabular-nums}
.bboard span.l{background:none;color:var(--hi);font-weight:900;font-size:1.6cqw}
.bboard span.on{background:var(--hi);color:var(--on-hi);font-weight:700}
.bstats{grid-column:1/-1;display:flex;justify-content:center;gap:3cqw;font-size:1.8cqw}
.bstats b{font-family:var(--num);color:var(--hi-soft);font-size:2.6cqw;margin-left:.4cqw}
.bstats .win b{color:var(--hot)}

/* 搖一搖賽跑 */
.race{width:100%;display:grid;gap:1cqw}
.lane{display:grid;grid-template-columns:13cqw 1fr;gap:1.2cqw;align-items:center;font-size:1.6cqw;text-align:left}
.track{position:relative;height:4.2cqw;border-radius:.5cqw;background:rgba(255,255,255,.05);border-right:.5cqw dashed var(--hi)}
[data-industry="logistics"] .track{border-radius:0;background:#2b2f34;background-image:linear-gradient(90deg,#f4f4f4 50%,transparent 50%);background-size:3cqw .3cqw;background-repeat:repeat-x;background-position:0 50%}
[data-industry="tech"] .track{height:2.6cqw;background:linear-gradient(90deg,rgba(90,209,255,.05),rgba(90,209,255,.18))}
.racer{position:absolute;top:50%;width:3.6cqw;height:3.6cqw;transform:translate(-50%,-50%);transition:left .1s linear;border-radius:50%;background:radial-gradient(circle,var(--hi-soft) 30%,var(--hi) 31% 60%,var(--primary) 61%)}

.btn{background:var(--hi);color:var(--on-hi);border:0;border-radius:4px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--hi-soft)}

.btn.stop{background:var(--hot);color:#fff}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 9px;color:var(--paper);width:100%;min-width:0}
.check{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:0}
.secret{display:flex;justify-content:space-between;align-items:center;background:var(--ink);border:1px dashed var(--line);border-radius:4px;padding:8px 10px}

.prizes{display:grid;gap:6px}
.prize-btn{display:grid;grid-template-columns:1fr auto;gap:6px;text-align:left;background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 10px;cursor:pointer}
.prize-btn small{display:block;color:var(--muted);font-size:12px}
.prize-btn b{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--hi-soft);align-self:center}

.prize-btn.done{opacity:.45}

.log li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.log li span:last-child{color:var(--muted);white-space:nowrap}

let kitKey='classic';
try{const s=localStorage.getItem('weiya-kit');if(s&&THEMES[s])kitKey=s}catch(e){}
let T,GAMES,DEPTS,employees,checked,lastChecked,wonIds,prizes,winners,S,company,mode;

function initData(){
  T=THEMES[kitKey];GAMES=Object.assign({},BASE,T.games);
  let seed=2026+kitKey.length;
  const srand=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const SUR='陳林黃張李王吳劉蔡楊許鄭謝郭洪曾邱廖賴周徐蘇葉莊呂江何蕭羅高'.split('');
  const GIV='志明怡君雅婷家豪俊宏佳穎淑芬冠廷欣妤承翰美玲建國宗郁涵柏睿育誠慧珊'.split('');
  DEPTS=T.depts.map(([name,n],i)=>({id:'d'+i,name,n}));
  employees=[];let no=1001;
  DEPTS.forEach(d=>{for(let i=0;i<d.n;i++){employees.push({id:'E'+no,n:no,name:pick(SUR,srand)+pick(GIV,srand)+pick(GIV,srand),dept:d.id});no++}});
  checked=new Set();
  const order=employees.slice().sort(()=>srand()-.5);
  const start=Math.round(employees.length*.77);
  order.slice(0,start).forEach(e=>checked.add(e.id));
  lastChecked=order.slice(start-6,start);
  wonIds=new Set();
  prizes=T.prizes.map(([name,item,q],i)=>({key:'p'+i,name,item,left:q,total:q}));
  winners=[];
  company=T.company;
  S={
    lt:{prize:'p0',rolling:false,timer:null,last:null},
    tug:{a:'d0',b:'d1',avg:true,sa:0,sb:0,t:15},
    rain:{running:false,t:15,board:{},env:[],pops:[]},
    db:{team:'d0',hold:false,level:0,peak:0,records:{}},
    lights:{on:false,lit:0,msg:T.L.lightsMsg,palette:T.palettes[0][0]},
    dm:{auto:true,queue:[],shown:0,pin:''},
    quiz:{i:0,phase:'idle',counts:[0,0,0,0],answered:new Set(),fast:[],t:10,scores:{}},
    guess:null,
    vote:{open:false,votes:T.shows.map(()=>0),weights:T.shows.map(()=>.5+Math.random()),done:false},
    bingo:null,
    race:{pos:{},places:[],running:false}
  };
}
const deptName=id=>DEPTS.find(d=>d.id===id).name;
const present=id=>employees.filter(e=>e.dept===id&&checked.has(e.id)).length;
const pool=()=>employees.filter(e=>checked.has(e.id)&&!wonIds.has(e.id));
const people=()=>employees.filter(e=>checked.has(e.id));

const $=s=>document.querySelector(s);
const stage=$('#stage'),controls=$('#controls');

function stopAll(){timers.forEach(clearInterval);timers=[];cancelAnimationFrame(raf);raf=0;if(!S)return;S.lt.rolling=false;S.rain.running=false;S.db.hold=false;S.race.running=false;S.vote.open=false;if(S.quiz.phase==='open')S.quiz.phase='idle'}

function fitCanvas(cv){const r=stage.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d}

function drawItem(ctx,e){
  const s=e.s;ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot);
  if(T.rainItem==='envelope'){
    ctx.fillStyle='#cf3a2f';ctx.fillRect(-s/2,-s*.7,s,s*1.4);
    ctx.fillStyle='#a92a22';ctx.beginPath();ctx.moveTo(-s/2,-s*.7);ctx.lineTo(0,-s*.25);ctx.lineTo(s/2,-s*.7);ctx.fill();
    ctx.fillStyle='#e4b75e';ctx.beginPath();ctx.arc(0,-s*.22,s*.2,0,Math.PI*2);ctx.fill();
  }else if(T.rainItem==='box'){
    ctx.fillStyle='#b9824b';ctx.fillRect(-s*.6,-s*.5,s*1.2,s);
    ctx.fillStyle='#e8d2a6';ctx.fillRect(-s*.1,-s*.5,s*.2,s);
    ctx.fillStyle='#f6f2ea';ctx.fillRect(s*.15,s*.05,s*.38,s*.3);
    ctx.fillStyle='#16181a';for(let i=0;i<4;i++)ctx.fillRect(s*.19+i*s*.08,s*.12,s*.03,s*.16);
  }else{
    ctx.fillStyle='#14203a';ctx.strokeStyle='#5ad1ff';ctx.lineWidth=Math.max(1,s*.05);
    ctx.fillRect(-s/2,-s/2,s,s);ctx.strokeRect(-s/2,-s/2,s,s);
    ctx.beginPath();for(let i=-1;i<=1;i++){const p=i*s*.25;ctx.moveTo(-s*.75,p);ctx.lineTo(-s/2,p);ctx.moveTo(s/2,p);ctx.lineTo(s*.75,p);ctx.moveTo(p,-s*.75);ctx.lineTo(p,-s/2);ctx.moveTo(p,s/2);ctx.lineTo(p,s*.75)}ctx.stroke();
    ctx.fillStyle='#5ad1ff';ctx.fillRect(-s*.18,-s*.18,s*.36,s*.36);
  }
  ctx.restore();
}

      <div class="ci-bars">${rates.map(x=>`<div class="ci-row${x.r===best?' lead':''}"><span>${x.d.name}</span><div class="ci-track"><div class="ci-fill" style="width:${x.r*100}%"></div></div><b>${Math.round(x.r*100)}%</b></div>`).join('')}</div>
    </div></div>`;
  };

  controls.innerHTML=`<button class="btn big" id="ci10" type="button">${L.sim}</button>

  const add=n=>{const rest=shuffle(employees.filter(e=>!checked.has(e.id))).slice(0,n);rest.forEach(e=>checked.add(e.id));if(rest.length)lastChecked=lastChecked.concat(rest).slice(-6);draw();stats()};

lights(){
  const L=T.L,st=S.lights;
  stage.innerHTML=top()+`<canvas id="cv"></canvas><div class="light-count" id="lCount"></div><div class="light-msg" id="lMsg"></div>`;
  controls.innerHTML=`<button class="btn big" id="lGo" type="button">${L.lightsOn}</button>
    <button class="btn ghost" id="lOff" type="button">${L.lightsOff}</button>
    <label class="field">投影字幕<input id="lText" type="text" maxlength="24"></label>
    <label class="field">燈光顏色<select id="lPal">${T.palettes.map(p=>`<option value="${p[0]}">${p[1]}</option>`).join('')}</select></label>
    <p class="hint">${L.lightsHint}</p>`;
  $('#lText').value=st.msg;$('#lPal').value=st.palette;
  const cv=$('#cv'),ctx=cv.getContext('2d');fitCanvas(cv);
  const W=cv.width,H=cv.height,cols=24,rows=10,grid=[];
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)grid.push({gx:x,gy:y,x:(x+.5+(Math.random()-.5)*.7)/cols*W,y:H*.32+(y+.5+(Math.random()-.5)*.6)/rows*H*.62,ph:Math.random()*6.28,c:Math.random()});
  shuffle(grid).forEach((p,i)=>p.rank=i);
  const pairs=[];if(T.network)grid.forEach(p=>grid.forEach(q=>{if((q.gx===p.gx+1&&q.gy===p.gy)||(q.gy===p.gy+1&&q.gx===p.gx))pairs.push([p,q])}));
  const total=Math.min(grid.length,checked.size);
  const col=p=>{const cs=T.palettes.find(x=>x[0]===st.palette)[2];return cs[Math.floor(p.c*cs.length)]};
  const loop=t=>{ctx.clearRect(0,0,W,H);
    if(st.on&&st.lit<total)st.lit=Math.min(total,st.lit+total/240);
    if(!st.on&&st.lit>0)st.lit=Math.max(0,st.lit-total/60);
    const k=Math.floor(st.lit*grid.length/Math.max(total,1));
    if(T.network){ctx.lineWidth=Math.max(1,W*.0012);pairs.forEach(([p,q])=>{if(p.rank<k&&q.rank<k){ctx.strokeStyle=`rgba(${col(p)},.35)`;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}})}
    grid.forEach(p=>{const lit=p.rank<k;const tw=.65+.35*Math.sin((t||0)/500+p.ph);const rad=W*(lit?.007:.003);
      if(lit){const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad*4);g.addColorStop(0,`rgba(${col(p)},${.55*tw})`);g.addColorStop(1,`rgba(${col(p)},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,rad*4,0,6.29);ctx.fill()}
      ctx.fillStyle=lit?`rgba(${col(p)},${tw})`:'rgba(255,255,255,.08)';ctx.beginPath();ctx.arc(p.x,p.y,rad,0,6.29);ctx.fill()});
    $('#lMsg').textContent=st.msg;$('#lCount').textContent=L.lightsCount+' '+Math.floor(st.lit)+' / '+checked.size;
    raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop);
  $('#lGo').onclick=()=>{st.on=true};$('#lOff').onclick=()=>{st.on=false};
  $('#lText').oninput=e=>{st.msg=e.target.value};$('#lPal').onchange=e=>{st.palette=e.target.value};
},

    $('#qLog').innerHTML=arr.map(([id,v],i)=>{const e=employees.find(x=>x.id===id);return `<li><span>${i+1}. ${e.name}・${deptName(e.dept)}</span><span>${fmt(v)} 分</span></li>`}).join('')||'<li><span>尚無成績</span></li>';
    $('#qGo').disabled=st.phase==='open';$('#qGo').textContent=st.phase==='reveal'?(st.i<T.quiz.length-1?'下一題':'重新作答本題'):'開始作答 10 秒'};
  const reset=()=>{st.phase='idle';st.counts=[0,0,0,0];st.answered=new Set();st.fast=[];st.t=10};
  $('#qGo').onclick=()=>{
    if(st.phase==='reveal'){if(st.i<T.quiz.length-1)st.i++;reset();paint();return}
    reset();st.phase='open';const ans=Q()[2];const ppl=shuffle(people());let ticks=0,idx=0;
    every(()=>{ticks++;const n=Math.floor(Math.random()*6)+2;
      for(let j=0;j<n&&idx<ppl.length;j++,idx++){const e=ppl[idx];const right=Math.random()<.58;const c=right?ans:pick([0,1,2,3].filter(x=>x!==ans));st.counts[c]++;st.answered.add(e.id);
        if(right){st.fast.push(e);st.scores[e.id]=(st.scores[e.id]||0)+500+st.t*50}}
      if(ticks%10===0)st.t--;
      if(st.t<=0){timers.forEach(clearInterval);timers=[];st.phase='reveal'}
      paint()},100);
  };
  paint();
},

guess(){
  // lo、hi 是已被猜過的邊界，可猜的數字為 lo+1～hi-1
  if(!S.guess)S.guess={lo:0,hi:101,secret:2+Math.floor(Math.random()*98),hist:[],done:null,show:false};
  const st=S.guess;
  stage.innerHTML=top()+`<div class="s-body" id="gBody"></div>`;
  controls.innerHTML=`<div class="secret"><span>密碼（只有主持人看得到）</span><b id="gSec"></b><button class="btn ghost" id="gShow" type="button"></button></div>
    <div class="two"><label class="field">現場來賓猜的數字<input id="gIn" type="number" min="1" max="100"></label>
    <div style="display:flex;align-items:end"><button class="btn" id="gGo" type="button" style="width:100%">送出</button></div></div>
    <button class="btn big" id="gSim" type="button">模擬下一位來賓猜</button>
    <button class="btn ghost" id="gNew" type="button">重新出題</button>

    <p class="hint">範圍頭尾不能猜。正式版可讓來賓用手機輪流輸入。</p>`;
  const paint=()=>{
    const last=st.hist[st.hist.length-1];
    $('#gBody').innerHTML=st.done?`<div class="s-eyebrow">爆了！密碼就是</div><div class="boom">${st.secret}</div><div class="s-title" style="font-size:4.5cqw">${st.done.name}・${deptName(st.done.dept)}</div><div class="s-sub">請上台！</div>`
      :`<div class="s-eyebrow">密碼在這個範圍之間</div><div class="range">${st.lo+1}<em>～</em>${st.hi-1}</div>
        <div class="range-bar"><i style="left:${st.lo}%;width:${st.hi-st.lo-1}%"></i></div>
        <div class="banner" style="font-size:2.6cqw">${last?`${last.who} 猜 ${last.n}，${last.n>st.secret?'太大了！':'太小了！'}`:'第一位，請出題！'}</div>`;
    $('#gSec').textContent=st.show?st.secret:'••';$('#gShow').textContent=st.show?'隱藏':'顯示';
    $('#gIn').min=st.lo+1;$('#gIn').max=st.hi-1;
    $('#gLog').innerHTML=st.hist.slice().reverse().map(h=>`<li><span>${h.who} 猜 ${h.n}</span><span>${h.n===st.secret?'猜中':h.n>st.secret?'太大':'太小'}</span></li>`).join('')||'<li><span>尚未開始</span></li>';
    $('#gGo').disabled=$('#gSim').disabled=!!st.done};
  const guess=(n,who)=>{if(st.done||n<=st.lo||n>=st.hi)return false;
    st.hist.push({n,who:who.name});if(n===st.secret)st.done=who;else if(n>st.secret)st.hi=n;else st.lo=n;paint();return true};
  $('#gGo').onclick=()=>{const n=parseInt($('#gIn').value,10);if(!(n>st.lo&&n<st.hi)){$('#gIn').value='';$('#gIn').placeholder='請輸入 '+(st.lo+1)+'～'+(st.hi-1);return}guess(n,pick(people()));$('#gIn').value=''};
  $('#gSim').onclick=()=>{const span=st.hi-st.lo-1;if(span<1)return;const mid=Math.floor((st.lo+st.hi)/2);const n=Math.random()<.5?mid:st.lo+1+Math.floor(Math.random()*span);guess(Math.min(st.hi-1,Math.max(st.lo+1,n)),pick(people()))};
  $('#gShow').onclick=()=>{st.show=!st.show;paint()};
  $('#gNew').onclick=()=>{S.guess=null;VIEWS.guess()};
  paint();
},

  }
  const st=S.bingo,LET='BINGO';
  const LINES=[];for(let i=0;i<5;i++){LINES.push([0,1,2,3,4].map(j=>i*5+j));LINES.push([0,1,2,3,4].map(j=>j*5+i))}LINES.push([0,6,12,18,24],[4,8,12,16,20]);
  stage.innerHTML=top()+`<div class="s-body"><div class="bingo">
    <div class="ball" id="bBall"><small>—</small><b>?</b></div>
    <div><div class="s-eyebrow" style="text-align:left;margin-bottom:1cqw" id="bEye"></div><div class="bboard" id="bBoard"></div></div>
    <div class="bstats" id="bStats"></div></div></div>`;
  controls.innerHTML=`<button class="btn big" id="bGo" type="button">開出下一顆</button>
    <div class="row"><button class="btn ghost" id="bAuto" type="button">自動開球</button><button class="btn ghost" id="bNew" type="button">重新開局</button></div>
    <p class="sec-label" style="margin-top:4px">賓果名單（前 5 名得獎）</p><ul class="log" id="bLog"></ul>
    <p class="hint">每位已報到者自動配發一張 5×5 卡，中間為免費格；連成三條線即賓果。</p>`;
  const recount=()=>{const set=new Set(st.drawn);
    Object.entries(st.cards).forEach(([id,c])=>{const n=LINES.filter(l=>l.every(k=>c[k]===0||set.has(c[k]))).length;st.lines[id]=n;
      if(n>=3&&!st.winners.includes(id))st.winners.push(id)})};
  const paint=(fresh)=>{const last=st.drawn[st.drawn.length-1];const set=new Set(st.drawn);
    const ball=$('#bBall');ball.innerHTML=last?`<small>${LET[Math.floor((last-1)/15)]}</small><b>${last}</b>`:'<small>BINGO</small><b>?</b>';
    if(fresh){ball.classList.remove('fresh');void ball.offsetWidth;ball.classList.add('fresh')}
    $('#bEye').textContent='已開出 '+st.drawn.length+' / 75 顆';
    let h='';for(let r=0;r<5;r++){h+=`<span class="l">${LET[r]}</span>`;for(let i=1;i<=15;i++){const n=r*15+i;h+=`<span class="${set.has(n)?'on':''}">${n}</span>`}}
    $('#bBoard').innerHTML=h;
    const v=Object.values(st.lines);const c1=v.filter(x=>x===1).length,c2=v.filter(x=>x===2).length,c3=st.winners.length;
    $('#bStats').innerHTML=`<span>一條線<b>${c1}</b></span><span>兩條線（聽牌）<b>${c2}</b></span><span class="win">賓果<b>${c3}</b></span>`;
    $('#bLog').innerHTML=st.winners.slice(0,10).map((id,i)=>{const e=employees.find(x=>x.id===id);return `<li${i>4?' class="absent"':''}><span>${i+1}. ${e.name}・${deptName(e.dept)}</span><span>${i<5?'得獎':'名額已滿'}</span></li>`}).join('')||'<li><span>尚無人賓果</span></li>';
    $('#bGo').disabled=st.drawn.length>=75};
  let auto=null;
  const next=()=>{if(st.drawn.length>=75)return;st.drawn.push(st.seq[st.drawn.length]);recount();paint(true);if(st.winners.length>=5&&auto){clearInterval(auto);auto=null;$('#bAuto').textContent='自動開球'}};
  $('#bGo').onclick=next;
  $('#bAuto').onclick=e=>{if(auto){clearInterval(auto);auto=null;e.target.textContent='自動開球';return}auto=every(next,1200);e.target.textContent='暫停自動'};
  $('#bNew').onclick=()=>{stopAll();S.bingo=null;VIEWS.bingo()};
  recount();paint(false);
},

lottery(){
  const L=T.L,lt=S.lt,P=()=>prizes.find(p=>p.key===lt.prize);
  stage.innerHTML=top()+`<div class="s-body">
    <div class="s-eyebrow" id="ltEye"></div><div class="prize-line" id="ltItem"></div>
    <div class="roll" id="ltName">準備抽獎</div><div class="meta-line" id="ltMeta"></div>
    <div class="won-strip" id="ltStrip"></div></div>`;
  controls.innerHTML=`<div class="prizes" id="prizeList"></div>
    <button class="btn big" id="ltGo" type="button">${L.draw}</button>
    <div class="row"><button class="btn ghost" id="ltRe" type="button">${L.redraw}</button></div>
    <div class="two"><label class="field">老闆加碼金額<input id="bonus" type="number" min="1000" step="1000" value="20000"></label>
    <div style="display:flex;align-items:end"><button class="btn ghost" id="bonusAdd" type="button" style="width:100%">加入獎項</button></div></div>
    <p class="sec-label" style="margin-top:4px">得獎紀錄</p><ul class="log" id="ltLog"></ul>`;
  const name=$('#ltName'),meta=$('#ltMeta'),btn=$('#ltGo');let keep=false;
  const paint=()=>{const p=P();
    $('#ltEye').textContent=p.name+'・剩 '+p.left+' / '+p.total+' 名';$('#ltItem').textContent=p.item;
    if(!lt.rolling&&!lt.last&&!keep)meta.textContent='抽獎池 '+pool().length+' 人';
    $('#ltStrip').innerHTML=winners.filter(w=>w.prize===p.key).map(w=>`<span${w.absent?' style="opacity:.4;text-decoration:line-through"':''}>${w.name}・${deptName(w.dept)}</span>`).join('');
    $('#prizeList').innerHTML=prizes.map(x=>`<button type="button" class="prize-btn${x.left?'':' done'}" data-k="${x.key}" aria-pressed="${x.key===lt.prize}"><span>${x.name}<small>${x.item}</small></span><b>${x.left}/${x.total}</b></button>`).join('');
    $('#prizeList').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(lt.rolling)return;lt.prize=b.dataset.k;lt.last=null;keep=false;name.textContent='準備抽獎';name.className='roll';btn.textContent=L.draw;paint()});
    $('#ltLog').innerHTML=winners.slice().reverse().map(w=>`<li class="${w.absent?'absent':''}"><span>${w.name}（${w.id}）</span><span>${prizes.find(x=>x.key===w.prize).name}${w.absent?'・缺席':''}</span></li>`).join('')||'<li><span>尚未抽出</span></li>';
    btn.disabled=!lt.rolling&&(!p.left||!pool().length);$('#ltRe').disabled=!lt.last||lt.last.absent;stats()};
  btn.onclick=()=>{const p=P();
    if(!lt.rolling){if(!p.left||!pool().length)return;
      lt.rolling=true;lt.last=null;keep=false;name.className='roll';btn.textContent='停！';btn.classList.add('stop');
      lt.timer=every(()=>{const e=pick(pool());name.textContent=e.name;meta.textContent=deptName(e.dept)+'・'+T.meta(e)},55);
    }else{clearInterval(lt.timer);lt.rolling=false;btn.textContent=L.drawAgain;btn.classList.remove('stop');
      const e=pick(pool());wonIds.add(e.id);p.left--;const w={...e,prize:p.key,absent:false};winners.push(w);lt.last=w;
      name.textContent=e.name;name.className='roll won';meta.textContent=deptName(e.dept)+'・'+T.meta(e)+'　'+L.claim;paint()}};
  $('#ltRe').onclick=()=>{if(!lt.last||lt.last.absent||lt.rolling)return;lt.last.absent=true;prizes.find(x=>x.key===lt.last.prize).left++;name.textContent='重新抽出';name.className='roll';meta.textContent=lt.last.name+' '+L.redrawMsg;keep=true;lt.last=null;btn.textContent=L.draw;paint()};
  $('#bonusAdd').onclick=()=>{if(lt.rolling)return;const v=Math.max(1000,parseInt($('#bonus').value,10)||0);const k='b'+prizes.length;prizes.push({key:k,name:'老闆加碼',item:'現金 NT$'+fmt(v),left:1,total:1});lt.prize=k;lt.last=null;name.textContent='老闆加碼！';name.className='roll won';meta.textContent='';keep=true;btn.textContent=L.draw;paint()};
  paint();
}
};

$('#fsBtn').onclick=()=>{try{const p=stage.requestFullscreen&&stage.requestFullscreen();if(p&&p.catch)p.catch(()=>{$('#fsBtn').textContent='此環境不支援全螢幕'})}catch(e){$('#fsBtn').textContent='此環境不支援全螢幕'}};
document.addEventListener('fullscreenchange',()=>{if(mode==='rain'||mode==='lights'){const k=mode;setTimeout(()=>go(k),50)}});

boot();
})();
</script>
